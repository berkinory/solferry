[workspace]
members = ["crates/*"]
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/berkinory/solferry"

[workspace.dependencies]
solferry-core = { path = "crates/solferry-core" }
solferry-proto = { path = "crates/solferry-proto" }

iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
netdev = "0.46"

anyhow = "1"
bytes = "1"
blake3 = { version = "1", features = ["rayon", "mmap"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
dirs = "7"
ed25519-dalek = "3"
fs4 = "1.1"
futures = "0.3"
gethostname = "1"
gpui-kit = "0.9"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = [
  "http1",
  "server",
] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
indicatif = "0.18"
keyring = { version = "3.6", default-features = false }
ksni = { version = "0.3", default-features = false, features = [
  "async-io",
  "blocking",
] }

noq-proto = "1.4"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-pki-types = { version = "1", features = ["std"] }
rust-i18n = "4.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "process",
] }
tracing = "0.1"
tray-icon = "0.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# What gets published. Slower to build than release, smaller and faster to run.
[profile.dist]
inherits = "release"
lto = "fat"

# iroh-mdns only sends on the default route's interface, which misses a phone's own hotspot.
# vendor/iroh-mdns-address-lookup/PATCH.md says what changed. Drop this once upstream has it.
[patch.crates-io]
iroh-mdns-address-lookup = { path = "vendor/iroh-mdns-address-lookup" }
