[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/berkinory/beam"

[workspace.dependencies]
beam-core = { path = "crates/beam-core" }
beam-proto = { path = "crates/beam-proto" }

iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
netdev = "0.46"

anyhow = "1"
bytes = "1"
blake3 = { version = "1", features = ["rayon", "mmap"] }
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
dirs = "7"
fs4 = "1.1"
futures = "0.3"
gethostname = "1"
gpui-kit = "0.9"
hex = "0.4"
indicatif = "0.18"
ksni = { version = "0.3", default-features = false, features = [
  "async-io",
  "blocking",
] }

noq-proto = "1.4"
prost = "0.14"
qrcode = { version = "0.14", default-features = false }
rand = "0.10"
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
    "process",
] }
tracing = "0.1"
tray-icon = "0.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
