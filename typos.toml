[files]
# Translations are not English, so every locale but English is skipped.
extend-exclude = [
  "LICENSE",
  "Cargo.lock",
  "vendor",
  "crates/*/locales/[!e]*.yml",
  "crates/*/locales/e[!n]*.yml",
  "android/app/src/main/res/values-*/strings.xml",
  # String catalogs hold every language in one file.
  "ios/Solferry/*.xcstrings",
]
