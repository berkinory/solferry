_version: 1
device:
  unnamed: "이름 없는 기기"
transfer:
  and_more: "%{first} 외"
about:
  unreachable: "%{name}에 연결할 수 없음"
  declined: "%{name}에서 거절함"
  busy: "%{name}이(가) 사용 중"
  not_paired: "먼저 %{name}과(와) 페어링하세요"
explain:
  storage:
    title: "파일을 읽거나 쓸 수 없습니다"
    next: "폴더, 권한, 여유 공간을 확인하세요."
  corrupt_data:
    title: "Solferry 설정이 손상되었습니다"
    next: "Solferry 데이터 폴더에서 손상된 파일을 삭제하세요. 기기를 다시 페어링해야 할 수도 있습니다."
  network_start:
    title: "네트워크를 시작하지 못했습니다"
    next: "Solferry를 다시 시작한 후 다시 시도하세요."
  invalid_relay_url:
    title: "릴레이 주소가 올바르지 않습니다"
    next: "릴레이가 출력한 전체 링크를 붙여넣으세요. 예: https://relay.example.com#token"
  unreachable:
    title: "기기에 연결할 수 없습니다"
    next: "상대 기기에서 Solferry를 여세요. 다른 네트워크에 있다면 Tailscale을 사용하거나 직접 운영하는 릴레이를 추가하세요."
  relay_check_failed:
    title: "릴레이가 작동하지 않습니다"
    next: "설정에서 상태를 확인하세요."
  not_paired:
    title: "먼저 이 기기와 페어링하세요"
    next: "여기서는 페어링된 기기만 연결할 수 있습니다."
  version_mismatch:
    title: "Solferry 버전이 일치하지 않습니다"
    next: "두 기기 모두 Solferry를 업데이트하세요."
  busy:
    title: "상대 기기가 사용 중입니다"
    next: "진행 중인 전송이 끝나면 다시 시도하세요."
  cancelled:
    title: "전송이 취소되었습니다"
    next: "다시 보내면 멈춘 곳부터 이어서 전송합니다."
  declined:
    title: "전송이 거절되었습니다"
    next: "상대방이 거절했습니다."
  no_space:
    title: "디스크 공간이 부족합니다"
    next: "받는 기기의 공간을 확보한 후 다시 시도하세요."
  delivery_failed:
    title: "파일을 저장하지 못했습니다"
    next: "받는 기기의 다운로드 폴더를 확인하세요."
  invalid_offer:
    title: "안전하지 않은 전송을 거부했습니다"
    next: "상대 기기가 Solferry에서 받을 수 없는 파일을 보내려고 했습니다."
  source_changed:
    title: "보내는 중에 파일이 변경되었습니다"
    next: "변경이 끝날 때까지 기다린 후 다시 시도하세요."
  unsupported_name:
    title: "보낼 수 없는 파일 이름입니다"
    next: "파일 이름을 바꾼 후 다시 시도하세요."
  nothing_to_send:
    title: "보낼 항목이 없습니다"
    next: "파일을 하나 이상 선택하세요. 바로가기와 링크는 건너뜁니다."
  hash_mismatch:
    title: "손상된 데이터를 발견했습니다"
    next: "손상된 사본은 삭제했습니다. 다시 보내세요."
  connection_lost:
    title: "연결이 끊어졌습니다"
    next: "다시 시도하세요. 전송은 멈춘 곳부터 이어집니다."
  invalid_ticket:
    title: "코드가 올바르지 않습니다"
    next: "sf1로 시작하는 전체 코드를 붙여넣으세요."
  ticket_expired:
    title: "코드가 만료되었습니다"
    next: "코드는 10분 동안 유효합니다. 새 코드를 만드세요."
  update:
    title: "Solferry를 업데이트하지 못했습니다"
    next: "나중에 다시 시도하거나 GitHub에서 다운로드하세요."
  own_ticket:
    title: "이 기기 자체의 코드입니다"
    next: "상대 기기에서 입력하세요."
  no_local_network:
    title: "로컬 네트워크에 연결되어 있지 않습니다"
    next: "Wi-Fi나 핫스팟에 연결한 후 다시 공유하세요."
  pairing_refused:
    title: "페어링이 거부되었습니다"
    next: "상대방에게 수락을 요청하거나 새 코드를 만드세요."
  unknown_device:
    title: "기기를 찾을 수 없습니다"
    next: "삭제되었을 수 있습니다."
  ambiguous_device:
    title: "일치하는 기기가 여러 대입니다"
    next: "목록에서 기기를 선택하세요."
  invalid_address:
    title: "주소가 올바르지 않습니다"
    next: "192.168.1.20 같은 IP 주소를 입력하세요."
  no_answer:
    title: "해당 주소에서 응답이 없습니다"
    next: "상대 기기에서 Solferry를 열고 모든 사람에게 표시되도록 설정되어 있는지 확인하세요."
  protocol:
    title: "Solferry에 문제가 발생했습니다"
    next: "버그입니다. 세부 정보와 함께 신고해 주세요."
