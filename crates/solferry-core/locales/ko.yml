_version: 1
device:
  unnamed: "이름 없는 기기"
transfer:
  and_more: "%{first} 외"
about:
  unreachable: "%{name}에 연결할 수 없어요"
  declined: "%{name}에서 거절했어요"
  busy: "%{name}에서 다른 전송을 진행 중이에요"
  not_paired: "먼저 %{name}과(와) 페어링하세요"
explain:
  storage:
    title: "파일을 읽거나 쓸 수 없어요"
    next: "폴더, 권한, 남은 저장 공간을 확인하세요."
  corrupt_data:
    title: "Solferry 설정 파일이 손상됐어요"
    next: "Solferry 데이터 폴더에서 손상된 파일을 삭제하세요. 기기를 다시 페어링해야 할 수도 있어요."
  network_start:
    title: "네트워크를 시작하지 못했어요"
    next: "Solferry를 다시 시작한 후 다시 시도하세요."
  invalid_relay_url:
    title: "Relay 서버 주소가 올바르지 않아요"
    next: "Relay 서버에 표시된 링크 전체를 붙여넣으세요. 예: https://relay.example.com#token"
  unreachable:
    title: "기기에 연결할 수 없어요"
    next: "상대 기기에서 Solferry를 여세요. 다른 네트워크에 있다면 Tailscale을 사용하거나 직접 운영하는 Relay 서버를 추가하세요."
  relay_check_failed:
    title: "작동하지 않는 Relay 서버가 있어요"
    next: "설정에서 상태를 확인하세요."
  not_paired:
    title: "먼저 이 기기와 페어링하세요"
    next: "여기서는 페어링된 기기만 이 기기에 연결할 수 있어요."
  version_mismatch:
    title: "Solferry 버전이 서로 달라요"
    next: "두 기기 모두 Solferry를 업데이트하세요."
  busy:
    title: "상대 기기에서 다른 전송을 진행 중이에요"
    next: "진행 중인 전송이 끝나면 다시 시도하세요."
  cancelled:
    title: "전송이 취소됐어요"
    next: "다시 보내면 멈춘 지점부터 이어서 보내요."
  declined:
    title: "전송이 거절됐어요"
    next: "상대방이 받지 않기로 했어요."
  no_space:
    title: "저장 공간이 부족해요"
    next: "받는 기기의 저장 공간을 확보한 후 다시 시도하세요."
  delivery_failed:
    title: "파일을 저장하지 못했어요"
    next: "받는 기기의 저장 폴더를 확인하세요."
  invalid_offer:
    title: "안전하지 않은 전송을 거부했어요"
    next: "상대 기기가 Solferry에서 받을 수 없는 파일을 보내려고 했어요."
  source_changed:
    title: "보내는 중에 파일이 변경됐어요"
    next: "파일 변경이 끝난 후 다시 시도하세요."
  unsupported_name:
    title: "보낼 수 없는 파일 이름이 있어요"
    next: "파일 이름을 바꾼 후 다시 시도하세요."
  nothing_to_send:
    title: "보낼 항목이 없어요"
    next: "파일을 하나 이상 선택하세요. 바로가기와 링크는 보내지 않아요."
  hash_mismatch:
    title: "손상된 데이터를 발견했어요"
    next: "손상된 데이터는 버렸어요. 다시 보내세요."
  connection_lost:
    title: "연결이 끊어졌어요"
    next: "다시 시도하세요. 전송은 멈춘 지점부터 이어져요."
  invalid_ticket:
    title: "코드가 올바르지 않아요"
    next: "sf1로 시작하는 코드 전체를 붙여넣으세요."
  ticket_expired:
    title: "코드가 만료됐어요"
    next: "코드는 10분 동안만 유효해요. 새 코드를 만드세요."
  update:
    title: "Solferry를 업데이트하지 못했어요"
    next: "나중에 다시 시도하거나 GitHub에서 다운로드하세요."
  own_ticket:
    title: "이 기기에서 만든 코드예요"
    next: "상대 기기에서 입력하세요."
  no_local_network:
    title: "로컬 네트워크에 연결되어 있지 않아요"
    next: "Wi-Fi나 핫스팟에 연결한 후 다시 공유하세요."
  pairing_refused:
    title: "페어링이 거절됐어요"
    next: "상대방에게 수락해 달라고 하거나 새 코드를 만드세요."
  unknown_device:
    title: "기기를 찾을 수 없어요"
    next: "삭제된 기기일 수 있어요."
  ambiguous_device:
    title: "일치하는 기기가 여러 대예요"
    next: "목록에서 기기를 선택하세요."
  invalid_address:
    title: "주소가 올바르지 않아요"
    next: "192.168.1.20 같은 IP 주소를 입력하세요."
  no_answer:
    title: "이 주소에서 응답이 없어요"
    next: "상대 기기에서 Solferry를 열고 '다른 기기에 표시'가 켜져 있는지 확인하세요."
  no_recent_target:
    title: "이 기기에서 아직 보낸 적이 없어요"
    next: "먼저 기기 이름을 지정해 한 번 보내세요. 그다음부터는 \"last\"로 그 기기를 다시 고를 수 있어요."
  protocol:
    title: "Solferry에 문제가 생겼어요"
    next: "버그예요. 세부 정보와 함께 알려 주세요."
