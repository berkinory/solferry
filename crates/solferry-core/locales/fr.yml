_version: 1
device:
  unnamed: "Appareil sans nom"
transfer:
  and_more: "%{first} et plus"
about:
  unreachable: "Impossible de joindre %{name}"
  declined: "%{name} a refusé"
  busy: "%{name} est occupé"
  not_paired: "Associez d'abord %{name}"
explain:
  storage:
    title: "Impossible de lire ou d'écrire un fichier"
    next: "Vérifiez le dossier, les autorisations et l'espace libre."
  corrupt_data:
    title: "Les paramètres de Solferry sont endommagés"
    next: "Supprimez le fichier endommagé dans le dossier de données de Solferry. Vous devrez peut-être associer à nouveau vos appareils."
  network_start:
    title: "Le réseau n'a pas démarré"
    next: "Redémarrez Solferry pour réessayer."
  invalid_relay_url:
    title: "Cette adresse de relais n'est pas valide"
    next: "Collez le lien complet affiché par votre relais, comme https://relay.example.com#token."
  unreachable:
    title: "Appareil injoignable"
    next: "Ouvrez Solferry sur cet appareil. Sur un autre réseau, utilisez Tailscale ou ajoutez votre propre relais."
  relay_check_failed:
    title: "Un relais ne fonctionne pas"
    next: "Consultez son état dans les Paramètres."
  not_paired:
    title: "Associez d'abord cet appareil"
    next: "Seuls les appareils associés peuvent le joindre d'ici."
  version_mismatch:
    title: "Les versions de Solferry ne correspondent pas"
    next: "Mettez à jour Solferry sur les deux appareils."
  busy:
    title: "L'autre appareil est occupé"
    next: "Attendez la fin de ses transferts, puis réessayez."
  cancelled:
    title: "Transfert annulé"
    next: "Renvoyez pour reprendre là où il s'est arrêté."
  declined:
    title: "Transfert refusé"
    next: "L'autre personne a refusé."
  no_space:
    title: "Espace disque insuffisant"
    next: "Libérez de l'espace sur l'appareil de réception et réessayez."
  delivery_failed:
    title: "Les fichiers n'ont pas pu être enregistrés"
    next: "Vérifiez le dossier de téléchargement sur l'appareil de réception."
  invalid_offer:
    title: "Transfert non sécurisé refusé"
    next: "L'autre appareil a proposé des fichiers que Solferry ne peut pas accepter."
  source_changed:
    title: "Un fichier a changé pendant l'envoi"
    next: "Attendez qu'il ne change plus et réessayez."
  unsupported_name:
    title: "Un nom de fichier ne peut pas être envoyé"
    next: "Renommez le fichier et réessayez."
  nothing_to_send:
    title: "Rien à envoyer"
    next: "Choisissez au moins un fichier. Les raccourcis et les liens sont ignorés."
  hash_mismatch:
    title: "Données endommagées détectées"
    next: "La copie défectueuse a été supprimée. Renvoyez-la."
  connection_lost:
    title: "Connexion perdue"
    next: "Réessayez. Les transferts reprennent là où ils se sont arrêtés."
  invalid_ticket:
    title: "Ce code n'est pas valide"
    next: "Collez le code entier, qui commence par sf1."
  ticket_expired:
    title: "Ce code a expiré"
    next: "Les codes sont valables 10 minutes. Créez-en un nouveau."
  update:
    title: "Impossible de mettre à jour Solferry"
    next: "Réessayez plus tard ou téléchargez-le sur GitHub."
  own_ticket:
    title: "C'est le code de cet appareil"
    next: "Saisissez-le plutôt sur l'autre appareil."
  no_local_network:
    title: "Pas sur un réseau local"
    next: "Connectez-vous au Wi-Fi ou à un point d'accès, puis partagez à nouveau."
  pairing_refused:
    title: "Association refusée"
    next: "Demandez-lui d'accepter ou créez un nouveau code."
  unknown_device:
    title: "Appareil introuvable"
    next: "Il a peut-être été supprimé."
  ambiguous_device:
    title: "Plusieurs appareils correspondent"
    next: "Choisissez l'appareil dans la liste."
  invalid_address:
    title: "Cette adresse n'est pas valide"
    next: "Saisissez une adresse IP comme 192.168.1.20."
  no_answer:
    title: "Aucune réponse à cette adresse"
    next: "Ouvrez Solferry sur cet appareil et vérifiez qu'il est visible par tous."
  protocol:
    title: "Un problème est survenu dans Solferry"
    next: "Il s'agit d'un bug. Merci de le signaler avec les détails."
