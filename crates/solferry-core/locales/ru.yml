_version: 1
device:
  unnamed: "Устройство без имени"
transfer:
  and_more: "%{first} и другие"
about:
  unreachable: "Нет связи с %{name}"
  declined: "%{name}: отклонено"
  busy: "%{name}: устройство занято"
  not_paired: "Сначала создайте пару с %{name}"
explain:
  storage:
    title: "Не удалось прочитать или записать файл"
    next: "Проверьте папку, разрешения и свободное место."
  corrupt_data:
    title: "Настройки Solferry повреждены"
    next: "Удалите повреждённый файл в папке данных Solferry. Возможно, пары с устройствами придётся создать заново."
  network_start:
    title: "Не удалось запустить сеть"
    next: "Перезапустите Solferry и попробуйте снова."
  invalid_relay_url:
    title: "Неверный адрес Relay-сервера"
    next: "Вставьте ссылку целиком, как её вывел Relay-сервер, например https://relay.example.com#token."
  unreachable:
    title: "Устройство недоступно"
    next: "Откройте на нём Solferry. Если оно в другой сети, используйте Tailscale или добавьте свой Relay-сервер."
  relay_check_failed:
    title: "Relay-сервер не работает"
    next: "Его состояние видно в настройках."
  not_paired:
    title: "Сначала создайте пару с этим устройством"
    next: "Отсюда к нему могут подключаться только сопряжённые устройства."
  version_mismatch:
    title: "Версии Solferry не совпадают"
    next: "Обновите Solferry на обоих устройствах."
  busy:
    title: "Другое устройство занято"
    next: "Дождитесь, пока оно завершит передачи, и попробуйте снова."
  cancelled:
    title: "Передача отменена"
    next: "Отправьте ещё раз, и она продолжится с того же места."
  declined:
    title: "Передача отклонена"
    next: "Получатель отказался."
  no_space:
    title: "Недостаточно места на диске"
    next: "Освободите место на устройстве-получателе и попробуйте снова."
  delivery_failed:
    title: "Не удалось сохранить файлы"
    next: "Проверьте папку для загрузок на устройстве-получателе."
  invalid_offer:
    title: "Небезопасная передача отклонена"
    next: "Другое устройство предложило файлы, которые Solferry не может принять."
  source_changed:
    title: "Файл изменился во время отправки"
    next: "Дождитесь, пока он перестанет меняться, и попробуйте снова."
  unsupported_name:
    title: "Недопустимое имя файла"
    next: "Переименуйте файл и попробуйте снова."
  nothing_to_send:
    title: "Нечего отправлять"
    next: "Выберите хотя бы один файл. Ярлыки и ссылки пропускаются."
  hash_mismatch:
    title: "Обнаружены повреждённые данные"
    next: "Испорченная копия удалена. Отправьте ещё раз."
  connection_lost:
    title: "Соединение потеряно"
    next: "Попробуйте снова. Передача продолжится с того же места."
  invalid_ticket:
    title: "Неверный код"
    next: "Вставьте код целиком, он начинается с sf1."
  ticket_expired:
    title: "Срок действия кода истёк"
    next: "Код действует 10 минут. Создайте новый."
  update:
    title: "Не удалось обновить Solferry"
    next: "Попробуйте позже или скачайте новую версию с GitHub."
  own_ticket:
    title: "Это код с этого же устройства"
    next: "Введите его на другом устройстве."
  no_local_network:
    title: "Нет подключения к локальной сети"
    next: "Подключитесь к Wi-Fi или точке доступа и поделитесь снова."
  pairing_refused:
    title: "Сопряжение отклонено"
    next: "Попросите принять запрос или создайте новый код."
  unknown_device:
    title: "Устройство не найдено"
    next: "Возможно, его удалили."
  ambiguous_device:
    title: "Подходит несколько устройств"
    next: "Выберите устройство из списка."
  invalid_address:
    title: "Неверный адрес"
    next: "Введите IP-адрес, например 192.168.1.20."
  no_answer:
    title: "По этому адресу никто не отвечает"
    next: "Откройте там Solferry и проверьте, что включена видимость для других."
  protocol:
    title: "В Solferry произошла ошибка"
    next: "Это ошибка в приложении. Сообщите о ней и приложите подробности."
