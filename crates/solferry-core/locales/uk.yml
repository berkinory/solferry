_version: 1
device:
  unnamed: "Пристрій без назви"
transfer:
  and_more: "%{first} та інші"
about:
  unreachable: "Немає зв’язку з %{name}"
  declined: "%{name}: відхилено"
  busy: "%{name}: пристрій зайнятий"
  not_paired: "Спершу створіть пару з %{name}"
explain:
  storage:
    title: "Не вдалося прочитати або записати файл"
    next: "Перевірте папку, дозволи та вільне місце."
  corrupt_data:
    title: "Налаштування Solferry пошкоджено"
    next: "Видаліть пошкоджений файл у папці даних Solferry. Можливо, пари з пристроями доведеться створити заново."
  network_start:
    title: "Не вдалося запустити мережу"
    next: "Перезапустіть Solferry і спробуйте ще раз."
  invalid_relay_url:
    title: "Неправильна адреса Relay-сервера"
    next: "Вставте посилання повністю, як його вивів Relay-сервер, наприклад https://relay.example.com#token."
  unreachable:
    title: "Пристрій недоступний"
    next: "Відкрийте на ньому Solferry. Якщо він в іншій мережі, використайте Tailscale або додайте свій Relay-сервер."
  relay_check_failed:
    title: "Relay-сервер не працює"
    next: "Його стан видно в налаштуваннях."
  not_paired:
    title: "Спершу створіть пару з цим пристроєм"
    next: "Звідси до нього можуть підключатися лише пристрої в парі."
  version_mismatch:
    title: "Версії Solferry не збігаються"
    next: "Оновіть Solferry на обох пристроях."
  busy:
    title: "Інший пристрій зайнятий"
    next: "Дочекайтеся, поки він завершить передачі, і спробуйте ще раз."
  cancelled:
    title: "Передачу скасовано"
    next: "Надішліть ще раз, і передача продовжиться з того самого місця."
  declined:
    title: "Передачу відхилено"
    next: "Отримувач відмовився."
  no_space:
    title: "Недостатньо місця на диску"
    next: "Звільніть місце на пристрої-отримувачі й спробуйте ще раз."
  delivery_failed:
    title: "Не вдалося зберегти файли"
    next: "Перевірте папку завантажень на пристрої-отримувачі."
  invalid_offer:
    title: "Небезпечну передачу відхилено"
    next: "Інший пристрій запропонував файли, які Solferry не може прийняти."
  source_changed:
    title: "Файл змінився під час надсилання"
    next: "Дочекайтеся, поки він перестане змінюватися, і спробуйте ще раз."
  unsupported_name:
    title: "Неприпустиме ім’я файлу"
    next: "Перейменуйте файл і спробуйте ще раз."
  nothing_to_send:
    title: "Нічого надсилати"
    next: "Виберіть хоча б один файл. Ярлики та посилання пропускаються."
  hash_mismatch:
    title: "Виявлено пошкоджені дані"
    next: "Зіпсовану копію видалено. Надішліть ще раз."
  connection_lost:
    title: "З’єднання втрачено"
    next: "Спробуйте ще раз. Передача продовжиться з того самого місця."
  invalid_ticket:
    title: "Неправильний код"
    next: "Вставте код повністю, він починається з sf1."
  ticket_expired:
    title: "Термін дії коду минув"
    next: "Код діє 10 хвилин. Створіть новий."
  update:
    title: "Не вдалося оновити Solferry"
    next: "Спробуйте пізніше або завантажте нову версію з GitHub."
  own_ticket:
    title: "Це код із цього ж пристрою"
    next: "Введіть його на іншому пристрої."
  no_local_network:
    title: "Немає підключення до локальної мережі"
    next: "Підключіться до Wi-Fi або точки доступу й поділіться знову."
  pairing_refused:
    title: "Створення пари відхилено"
    next: "Попросіть прийняти запит або створіть новий код."
  unknown_device:
    title: "Пристрій не знайдено"
    next: "Можливо, його видалили."
  ambiguous_device:
    title: "Підходить кілька пристроїв"
    next: "Виберіть пристрій зі списку."
  invalid_address:
    title: "Неправильна адреса"
    next: "Введіть IP-адресу, наприклад 192.168.1.20."
  no_answer:
    title: "За цією адресою ніхто не відповідає"
    next: "Відкрийте там Solferry і перевірте, чи ввімкнено видимість для інших."
  no_recent_target:
    title: "З цього пристрою ще нічого не надсилали"
    next: "Один раз надішліть на пристрій за назвою. Після цього \"last\" вибере його знову."
  protocol:
    title: "У Solferry сталася помилка"
    next: "Це помилка в застосунку. Повідомте про неї й додайте подробиці."
