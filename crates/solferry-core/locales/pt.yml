    title: "As versões do Solferry não são iguais"
    next: "Atualize o Solferry nos dois dispositivos."
  busy:
    title: "O outro dispositivo está ocupado"
    next: "Espere as transferências dele terminarem e tente de novo."
  cancelled:
    title: "Transferência cancelada"
    next: "Envie de novo para continuar de onde parou."
  declined:
    title: "Transferência recusada"
    next: "A outra pessoa recusou."
  no_space:
    title: "Espaço em disco insuficiente"
    next: "Libere espaço no dispositivo que vai receber e tente de novo."
  delivery_failed:
    title: "Não foi possível salvar os arquivos"
    next: "Verifique a pasta de downloads no dispositivo que recebe."
