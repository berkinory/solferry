explain:
  storage:
    title: "Não foi possível ler ou gravar um arquivo"
    next: "Verifique a pasta, as permissões e o espaço livre."
  corrupt_data:
    title: "As configurações do Solferry estão danificadas"
    next: "Exclua o arquivo danificado na pasta de dados do Solferry. Talvez seja preciso parear os dispositivos de novo."
  network_start:
    title: "A rede não iniciou"
    next: "Reinicie o Solferry para tentar de novo."
  invalid_relay_url:
    title: "Esse endereço de relay não é válido"
    next: "Cole o link completo que seu relay mostrou, como https://relay.example.com#token."
