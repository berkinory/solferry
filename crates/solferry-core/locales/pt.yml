    title: "Transferência insegura recusada"
    next: "O outro dispositivo ofereceu arquivos que o Solferry não pode aceitar."
  source_changed:
    title: "Um arquivo mudou durante o envio"
    next: "Espere ele parar de mudar e tente de novo."
  unsupported_name:
    title: "Não é possível enviar um nome de arquivo"
    next: "Renomeie o arquivo e tente de novo."
  nothing_to_send:
    title: "Nada para enviar"
    next: "Escolha pelo menos um arquivo. Atalhos e links são ignorados."
  hash_mismatch:
    title: "Dados danificados detectados"
    next: "A cópia com erro foi descartada. Envie de novo."
  connection_lost:
    title: "Conexão perdida"
    next: "Tente de novo. As transferências continuam de onde pararam."
  invalid_ticket:
    title: "Esse código não é válido"
    next: "Cole o código inteiro, começando com sf1."
  ticket_expired:
    title: "Esse código expirou"
    next: "Os códigos duram 10 minutos. Crie um novo."
  update:
    title: "Não foi possível atualizar o Solferry"
    next: "Tente de novo mais tarde ou baixe no GitHub."
  own_ticket:
    title: "Esse é o código deste dispositivo"
    next: "Digite-o no outro dispositivo."
  no_local_network:
    title: "Fora de uma rede local"
    next: "Conecte-se a um Wi-Fi ou a um hotspot e compartilhe de novo."
  pairing_refused:
    title: "O pareamento foi recusado"
    next: "Peça para aceitarem ou crie um novo código."
  unknown_device:
    title: "Dispositivo não encontrado"
    next: "Talvez ele tenha sido removido."
  ambiguous_device:
    title: "Mais de um dispositivo corresponde"
    next: "Escolha o dispositivo na lista."
  invalid_address:
    title: "Esse endereço não é válido"
    next: "Digite um endereço IP como 192.168.1.20."
  no_answer:
    title: "Nada respondeu nesse endereço"
    next: "Abra o Solferry nele e verifique se ele está visível para todos."
  protocol:
    title: "Algo deu errado no Solferry"
    next: "Isso é um bug. Informe com os detalhes."
