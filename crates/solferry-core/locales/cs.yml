  unknown_device:
    title: "Zařízení nebylo nalezeno"
    next: "Možná bylo odebráno."
  ambiguous_device:
    title: "Odpovídá více zařízení"
    next: "Vyberte zařízení ze seznamu."
  invalid_address:
    title: "Adresa není platná"
    next: "Zadejte IP adresu, například 192.168.1.20."
  no_answer:
    title: "Na této adrese nic neodpovídá"
    next: "Otevřete tam Solferry a zkontrolujte, že je viditelné pro všechny."
  protocol:
    title: "V Solferry se něco pokazilo"
    next: "Jde o chybu aplikace. Nahlaste ji prosím i s podrobnostmi."
