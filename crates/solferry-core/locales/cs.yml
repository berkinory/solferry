    next: "Vadná kopie byla zahozena. Odešlete ji znovu."
  connection_lost:
    title: "Spojení bylo ztraceno"
    next: "Zkuste to znovu. Přenosy navážou tam, kde skončily."
  invalid_ticket:
    title: "Kód není platný"
    next: "Vložte celý kód začínající sf1."
  ticket_expired:
    title: "Platnost kódu vypršela"
    next: "Kódy platí 10 minut. Vytvořte nový."
  update:
    title: "Solferry se nepodařilo aktualizovat"
    next: "Zkuste to později, nebo si ho stáhněte z GitHubu."
