    next: "La copia difettosa è stata scartata. Invia di nuovo."
  connection_lost:
    title: "Connessione persa"
    next: "Riprova. I trasferimenti riprendono da dove si erano fermati."
  invalid_ticket:
    title: "Il codice non è valido"
    next: "Incolla il codice completo, che inizia con sf1."
  ticket_expired:
