    next: "L'altro dispositivo ha offerto file che Solferry non può accettare."
  source_changed:
    title: "Un file è cambiato durante l'invio"
    next: "Aspetta che smetta di cambiare e riprova."
  unsupported_name:
    title: "Un nome di file non può essere inviato"
    next: "Rinomina il file e riprova."
