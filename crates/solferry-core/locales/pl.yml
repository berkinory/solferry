    title: "Nieprawidłowy adres Relay"
    next: "Wklej cały link wyświetlony przez Relay, np. https://relay.example.com#token."
  unreachable:
    title: "Urządzenie jest niedostępne"
    next: "Otwórz na nim Solferry. Jeśli jest w innej sieci, użyj Tailscale lub dodaj własny Relay."
  relay_check_failed:
    title: "Relay nie działa"
    next: "Sprawdź jego stan w Ustawieniach."
  not_paired:
    title: "Najpierw sparuj to urządzenie"
    next: "Tylko sparowane urządzenia mogą się z nim stąd połączyć."
  version_mismatch:
    title: "Wersje Solferry są niezgodne"
    next: "Zaktualizuj Solferry na obu urządzeniach."
