    next: "Zwolnij miejsce na urządzeniu odbierającym i spróbuj ponownie."
  delivery_failed:
    title: "Nie udało się zapisać plików"
    next: "Sprawdź folder pobierania na urządzeniu odbierającym."
  invalid_offer:
