<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solferry</title>
<style>
:root { color-scheme: dark; --page: #0c0c10; --card: #16161c; --line: #26262e; --ink: #ececf1; --muted: #9a9aa6; --primary: #3b34e0; --danger: #f0616d; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 10px; }
.row + .row { border-top: 1px solid var(--line); border-radius: 0; }
.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size, .state { color: var(--muted); font-size: 14px; white-space: nowrap; }
.state.failed { color: var(--danger); }
a.get, button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 14px; text-decoration: none; cursor: pointer; }
button.wide { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; }
#drop { display: block; border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px 16px; text-align: center; color: var(--muted); cursor: pointer; }
#drop.over { border-color: var(--primary); color: var(--ink); }
#drop input { display: none; }
#sent:empty { display: none; }
#sent { margin-top: 16px; }
footer { margin-top: 24px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main>
@CONTENT@
<footer>Sent with Solferry, straight over your network.</footer>
</main>
</body>
</html>
