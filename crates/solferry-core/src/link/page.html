<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Solferry</title>
<style>
@font-face { font-family: "Inter Tight"; font-weight: 400; src: url("font/regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Inter Tight"; font-weight: 500; src: url("font/medium.ttf") format("truetype"); font-display: swap; }
:root {
  --page: #ffffff; --well: #f5f5f6; --raised: #ebebed; --line: #e3e3e4; --ink: #18181b; --muted: #66666e;
  --primary: #3a33e8; --primary-fill: #3730de; --brand: #8580ff; --success: #047857; --danger: #b91c1c;
  --depth: rgba(0, 0, 0, .05); --rim: rgba(0, 0, 0, .035); --lift: rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #18181b; --well: #101012; --raised: #222225; --line: #2f2f32; --ink: #ececef; --muted: #a1a1aa;
    --primary: #8580ff; --primary-fill: #3630db; --success: #34d399; --danger: #f87171;
    --depth: rgba(0, 0, 0, .45); --rim: rgba(255, 255, 255, .03); --lift: rgba(0, 0, 0, .06);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 520px; margin: 0 auto; padding: 20px 16px 32px; }
svg.i { width: 20px; height: 20px; flex: none; }
header { display: flex; align-items: center; gap: 8px; margin-bottom: 26px; font-size: 19px; font-weight: 500; }
header svg { width: 26px; height: 26px; color: var(--brand); }
h1 { font-size: 19px; font-weight: 500; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 17px; }
.frame { background: var(--page); border: 1px solid var(--line); border-radius: 26px; padding: 4px; box-shadow: 0 1px 2px var(--lift); }
.well { background: var(--well); border-radius: 22px; padding: 9px; box-shadow: inset 0 1px 2px var(--depth), inset 0 0 0 1px var(--rim); }
.row { display: flex; align-items: center; gap: 13px; min-height: 52px; padding: 4px 4px 4px 8px; }
.row > svg.i { color: var(--muted); }
.name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.size, .state { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.state.sent { color: var(--success); }
.state.failed { color: var(--danger); }
.get { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 14px; color: var(--ink); }
.get:hover { background: var(--raised); }
.primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; margin-top: 13px; border: 0; border-radius: 18px; background: var(--primary-fill); color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
.primary:hover { filter: brightness(1.08); }
#drop { display: flex; flex-direction: column; align-items: center; gap: 13px; padding: 35px 17px; border-radius: 22px; text-align: center; color: var(--muted); cursor: pointer; transition: background .15s; }
#drop:hover, #drop.over { background: var(--raised); color: var(--ink); }
#drop .badge { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 18px; background: var(--primary-fill); color: #fff; }
#drop input { display: none; }
#sent:empty { display: none; }
#sent { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 4px; }
.bar { height: 3px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }
.file { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
footer { margin-top: 26px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>

<main>
<header><svg><use href="#mark"/></svg>Solferry</header>
@CONTENT@
<footer>Sent with Solferry, straight over your network.</footer>
</main>
</body>
</html>
