version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Kept at the version iroh uses, see Cargo.toml.
      - dependency-name: netdev
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: dtolnay/rust-toolchain
