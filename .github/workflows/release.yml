name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfreetype-dev libfontconfig-dev
      - run: cargo build --release --locked -p solferry-cli -p solferry-desktop --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          ASSETS="$GITHUB_WORKSPACE/crates/solferry-desktop/assets"
          if [ -f solferry.exe ]; then
            7z a "$GITHUB_WORKSPACE/dist/solferry-${{ matrix.target }}.zip" solferry.exe solferry-desktop.exe
          elif [ "$RUNNER_OS" = macOS ]; then
            "$GITHUB_WORKSPACE/packaging/macos/bundle.sh" .
            ditto -c -k --keepParent Solferry.app "$GITHUB_WORKSPACE/dist/Solferry-${{ matrix.target }}.zip"
            tar czf "$GITHUB_WORKSPACE/dist/solferry-cli-${{ matrix.target }}.tar.gz" solferry
          else
            cp "$ASSETS/solferry.desktop" .
            cp "$ASSETS/icon.png" solferry.png
            tar czf "$GITHUB_WORKSPACE/dist/solferry-${{ matrix.target }}.tar.gz" solferry solferry-desktop solferry.desktop solferry.png
          fi
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo install cargo-ndk --locked
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SOLFERRY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOLFERRY_ABIS: arm64-v8a
        run: |
          export SOLFERRY_KEYSTORE="$RUNNER_TEMP/release.jks"
          base64 -d <<< "$KEYSTORE_BASE64" > "$SOLFERRY_KEYSTORE"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew assembleRelease --console=plain
          mkdir "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Solferry-android.apk"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
