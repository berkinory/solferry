name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p beam-cli --target ${{ matrix.target }}
      - shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ -f beam.exe ]; then 7z a "$GITHUB_WORKSPACE/beam-${{ matrix.target }}.zip" beam.exe
          else tar czf "$GITHUB_WORKSPACE/beam-${{ matrix.target }}.tar.gz" beam; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: beam-${{ matrix.target }}.*
