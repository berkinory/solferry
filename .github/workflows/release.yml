name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfreetype-dev libfontconfig-dev
      - run: cargo build --release --locked -p beam-cli -p beam-desktop --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          if [ -f beam.exe ]; then
            7z a "$GITHUB_WORKSPACE/dist/beam-${{ matrix.target }}.zip" beam.exe beam-desktop.exe
          else
            tar czf "$GITHUB_WORKSPACE/dist/beam-${{ matrix.target }}.tar.gz" beam beam-desktop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: beam-${{ matrix.target }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
