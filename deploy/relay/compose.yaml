services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:?}
      RELAY_EMAIL: ${RELAY_EMAIL:?}
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "7842:7842/udp"
    volumes:
      - certs:/data

volumes:
  certs:
