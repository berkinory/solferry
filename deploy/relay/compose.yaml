services:
  relay:
    build: .
    image: ghcr.io/berkinory/solferry-relay:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:?}
      RELAY_EMAIL: ${RELAY_EMAIL:-}
      # Bytes per second each client may send into the relay. Unset means no limit.
      RELAY_BYTES_PER_SECOND: ${RELAY_BYTES_PER_SECOND:-}
      RELAY_MAX_BURST_BYTES: ${RELAY_MAX_BURST_BYTES:-}
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "7842:7842/udp"
    volumes:
      - certs:/data

volumes:
  certs:
