services:
  relay:
    build: .
    image: beam-relay
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RELAY_HOSTNAME: ${RELAY_HOSTNAME:?}
      RELAY_EMAIL: ${RELAY_EMAIL:-}
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
      - "7842:7842/udp"
    volumes:
      - certs:/data

volumes:
  certs:
